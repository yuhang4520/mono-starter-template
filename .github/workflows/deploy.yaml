name: Deploy servers
on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'apps/admin/**', 'packages/**', 'infra/**', 'scripts/**', '.github/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.dockerignore', '.npmrc']
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        description: Build and deploy all components (required for first deployment)
        default: true
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/checks.yaml
  changes:
    permissions:
      contents: read
      actions: read
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find last successful rollout
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync}=require('node:child_process');
            const {deploymentBase}=require('./scripts/deployment-base.cjs');
            const base=await deploymentBase({
              listRuns: async page => (await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'deploy.yaml',branch:'main',status:'success',per_page:20,page})).data.workflow_runs,
              listJobs: async run_id => (await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id,filter:'latest',per_page:100})).data.jobs,
              isAncestor: async sha => {try {execFileSync('git',['merge-base','--is-ancestor',sha,context.sha]);return true;}catch{return false;}},
            });
            core.setOutput('sha',base || '');
      - id: plan
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          FORCE_DEPLOY: ${{ inputs.force }}
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs');
          const {deploymentPlan}=require('./scripts/deployment-plan.cjs');
          const base=process.env.BASE_SHA;
          const force=process.env.FORCE_DEPLOY==='true' || !base || /^0+$/.test(base);
          const files=force?[]:execFileSync('git',['diff','--name-only',base,process.env.GITHUB_SHA],{encoding:'utf8'}).trim().split('\n');
          const plan=deploymentPlan(files,force);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`plan=${JSON.stringify(plan)}\nimages=${JSON.stringify(plan.images)}\n`);
          NODE
  images:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: target
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const component=process.env.COMPONENT;
          const dockerfile=component==='migration'?'packages/db/Dockerfile':`apps/${component}/Dockerfile`;
          const repository=`ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}/${component}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`dockerfile=${dockerfile}\nrepository=${repository}\n`);
          NODE
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.target.outputs.dockerfile }}
          push: true
          tags: ${{ steps.target.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.target.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: mkdir -p image && printf '%s\n' "$IMAGE" > image/image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: image/image.txt
          retention-days: 7
  rollout:
    needs: [changes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.2
      - uses: actions/cache@v4
        with:
          path: .terraform-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infra/k8s/.terraform.lock.hcl') }}
      - name: Authenticate to Alibaba Cloud (optional ACK OIDC)
        if: vars.ALIYUN_ROLE_ARN != ''
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          audience: actions.github.com
      - name: Install ACK credential plugin when using OIDC
        if: vars.ALIYUN_ROLE_ARN != ''
        run: |
          curl --fail --location --retry 3 https://github.com/AliyunContainerService/ack-ram-tool/releases/download/v0.19.0/ack-ram-tool_0.19.0_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/ack.tgz"
          tar -xzf "$RUNNER_TEMP/ack.tgz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/ack-ram-tool" /usr/local/bin/ack-ram-tool
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          test -n "$KUBE_CONFIG_BASE64"
          umask 077
          printf '%s' "$KUBE_CONFIG_BASE64" | base64 --decode > "$KUBECONFIG"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          kubectl version --client
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: image-artifacts
      - name: Normalize image manifests
        run: |
          mkdir -p images
          for component in api admin migration; do
            if [ -f "image-artifacts/image-$component/image.txt" ]; then
              mkdir -p "images/$component"
              cp "image-artifacts/image-$component/image.txt" "images/$component/image.txt"
            fi
          done
      - name: Reject obsolete commits before touching the cluster
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Migrate then roll out applications
        env:
          DEPLOY_PLAN: ${{ needs.changes.outputs.plan }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_ENV_JSON: ${{ secrets.API_ENV_JSON }}
          ADMIN_ENV_JSON: ${{ secrets.ADMIN_ENV_JSON }}
          API_CONFIG_JSON: ${{ vars.API_CONFIG_JSON }}
          ADMIN_CONFIG_JSON: ${{ vars.ADMIN_CONFIG_JSON }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          APP_NAME: ${{ vars.APP_NAME || 'starter' }}
          K8S_IMAGE_PULL_SECRET: ${{ vars.K8S_IMAGE_PULL_SECRET }}
          K8S_HOSTS_JSON: ${{ vars.K8S_HOSTS_JSON }}
          K8S_INGRESS_CLASS: ${{ vars.K8S_INGRESS_CLASS || 'nginx' }}
          K8S_TLS_SECRET: ${{ vars.K8S_TLS_SECRET }}
        run: node scripts/deploy-k8s.mjs
      - name: Remove runner credentials
        if: always()
        run: rm -f "$KUBECONFIG"
